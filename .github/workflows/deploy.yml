name: Deploy

# Run by hand from the Actions tab: "Deploy" -> "Run workflow". Each choice is a GitHub environment that holds its
# own settings (variables below) and is the only thing allowed to assume that environment's AWS role.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging]
        default: staging

permissions:
  contents: read
  id-token: write # lets the job sign in to AWS through OIDC

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: uv sync --all-packages --frozen
      - name: Test the backend
        run: uv run pytest
      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy
        working-directory: infra
        env:
          STAGE: ${{ inputs.environment }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          SES_DOMAIN: ${{ vars.SES_DOMAIN }}
          APP_URL: ${{ vars.APP_URL }}
          COGNITO_DOMAIN_PREFIX: ${{ vars.COGNITO_DOMAIN_PREFIX }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET_NAME: ${{ vars.GOOGLE_CLIENT_SECRET_NAME }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD || '5' }}
        run: >
          npx -y aws-cdk@2.1146.1 deploy "Worklight-$STAGE" --require-approval never
          -c stage="$STAGE"
          -c fromEmail="$FROM_EMAIL"
          -c sesDomain="$SES_DOMAIN"
          -c appUrl="$APP_URL"
          -c cognitoDomainPrefix="$COGNITO_DOMAIN_PREFIX"
          -c googleClientId="$GOOGLE_CLIENT_ID"
          -c googleClientSecretName="$GOOGLE_CLIENT_SECRET_NAME"
          -c alertEmail="$ALERT_EMAIL"
          -c monthlyBudgetUsd="$MONTHLY_BUDGET_USD"
