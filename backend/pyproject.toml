[project]
name = "call-time-backend"
version = "0.1.0"
description = "Call Time API and Cognito triggers (FastAPI on AWS Lambda)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "mangum>=0.19",
    "pydantic>=2.11",
    "boto3>=1.40",
    "tzdata>=2025.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/call_time"]
