[project]
name = "worklight-backend"
version = "0.1.0"
description = "Worklight API and Cognito triggers (FastAPI on AWS Lambda)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "mangum>=0.19",
    "pydantic>=2.11",
    "boto3>=1.40",
    "tzdata>=2025.2",
    "strawberry-graphql>=0.280",
    "mcp>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worklight"]
