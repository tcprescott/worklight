[project]
name = "call-time-infra"
version = "0.1.0"
description = "AWS CDK app that deploys Call Time"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib>=2.220",
    "constructs>=10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["call_time_infra"]
